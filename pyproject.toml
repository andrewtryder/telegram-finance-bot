[project]
name = "telegram-finance-bot"
version = "0.6.0"
description = "A Telegram bot for stock, crypto, and market index lookups."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Andrew Ryder" }]
dependencies = [
    "python-telegram-bot>=22.8,<23",
    "python-dotenv>=1.2.4,<2",
    "yfinance>=1.7.0,<1.8",
    "cachetools>=7.2.0,<8",
    "honeybadger>=1.3.0,<2",
    "aiohttp>=3.12,<4",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "pre-commit",
    "pillow",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
