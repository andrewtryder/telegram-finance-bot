[project]
name = "telegram-stock-price-bot"
version = "0.4.0"
description = "A Telegram bot for stock, crypto, and market index lookups."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Andrew Ryder" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
