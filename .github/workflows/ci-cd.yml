name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request_target:
    types: [opened, edited, synchronize]
    branches: [ main ]
  workflow_dispatch: 

jobs:
  # JOB 1: LINT PR TITLE (Runs securely from main branch context)
  pr-lint:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            ci

  # JOB 2: DEPLOYMENT (Only runs on direct pushes or completed merges to main)
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Sync GitHub Secrets to Railway
        run: railway variables set TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TWELVEDATA_API_KEY="${{ secrets.TWELVEDATA_API_KEY }}" ALLOWED_CHAT_IDS="${{ secrets.ALLOWED_CHAT_IDS }}" --service "triumphant-enthusiasm"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy via Railway CLI
        run: railway up --detach --service "triumphant-enthusiasm"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}