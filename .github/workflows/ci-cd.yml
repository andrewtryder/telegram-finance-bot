name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  pull_request_target:
    types: [opened, edited, synchronize]
    branches: [ main ]
  workflow_dispatch:

jobs:
  # JOB 1: LINT PR TITLE (Runs securely from main branch context)
  pr-lint:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            style
            refactor
            test
            build
            ci
            chore
            revert

  # JOB 2: TEST AND LINT (Runs tests and linter before deploy on pushes/PRs)
  test-and-lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run Ruff Linter
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Tests
        run: |
          PYTHONPATH=. python -m pytest tests/

  # JOB 3: DEPLOYMENT (Only runs on direct pushes or completed merges to main after tests pass)
  deploy:
    needs: test-and-lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Sync GitHub Secrets to Railway
        run: railway variables set TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" ALLOWED_CHAT_IDS="${{ secrets.ALLOWED_CHAT_IDS }}" HONEYBADGER_API_KEY="${{ secrets.HONEYBADGER_API_KEY }}" HONEYBADGER_ENVIRONMENT=production --service "${{ secrets.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy via Railway CLI
        run: railway up --detach --service "${{ secrets.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
