name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target (choose one)"
        required: true
        type: choice
        options:
          - none
          - cloudflare
          - railway

permissions:
  contents: read

jobs:
  # TEST AND LINT (Runs tests and linter before deploy on pushes/PRs)
  test-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run Tests
        run: |
          uv run --frozen python -m pytest tests/

      - name: Validate Cloudflare Worker Packaging
        run: npx --yes wrangler@4 deploy --dry-run

  # JOB 3: DEPLOYMENT (Only runs on direct pushes or completed merges to main after tests pass)
  deploy:
    needs: test-and-lint
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'railway'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      # Account/workspace tokens use RAILWAY_API_TOKEN (not RAILWAY_TOKEN).
      # Project tokens alone auto-scope; API tokens need an explicit link.
      - name: Link Railway project
        run: railway link --project "${{ secrets.RAILWAY_PROJECT_ID }}" --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" --service "${{ secrets.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Sync GitHub Secrets to Railway
        run: railway variables set TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" ALLOWED_CHAT_IDS="${{ secrets.ALLOWED_CHAT_IDS }}" HONEYBADGER_API_KEY="${{ secrets.HONEYBADGER_API_KEY }}" HONEYBADGER_ENVIRONMENT=production --service "${{ secrets.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy via Railway CLI
        run: railway up --detach --service "${{ secrets.RAILWAY_SERVICE_NAME }}"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

  deploy-cloudflare:
    needs: test-and-lint
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'cloudflare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
