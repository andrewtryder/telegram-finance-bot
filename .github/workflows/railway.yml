name: Deploy to Railway

on:
  push:
    branches:
      - main
  # Allows you to trigger the deployment manually from the GitHub UI Actions tab
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Sync GitHub Secrets to Railway
        # This tells Railway to securely save these variables into your Railway project
        run: railway variables set TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TWELVEDATA_API_KEY="${{ secrets.TWELVEDATA_API_KEY }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy via Railway CLI
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}